---
repos:
- repo: https://github.com/thibaudcolas/pre-commit-stylelint
  rev: v16.26.1
  hooks:
  - id: stylelint
    additional_dependencies:
    - stylelint@15.2.0
    - stylelint-config-standard@30.0.1
    - stylelint-config-recommended-scss@9.0.1
    exclude: |
      (?x)^(
          amd/static/styles/bokeh-widgets-0.12.5.min.css|
          amd/static/styles/bokeh-0.12.5.min.css
      )$
    pass_filenames: true
